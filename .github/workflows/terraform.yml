name: Terraform

on:
  workflow_dispatch:

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform -chdir=./test init

      - name: Terraform Plan
        run: terraform -chdir=./test plan -var="project_id=${{ secrets.GCP_PROJECT_ID }}" -var="impersonate_service_account=${{ secrets.GCP_IMPERSONATE_SA }}"

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform -chdir=./test init

      - name: Terraform Apply
        run: terraform -chdir=./test apply -auto-approve -var="project_id=${{ secrets.GCP_PROJECT_ID }}" -var="impersonate_service_account=${{ secrets.GCP_IMPERSONATE_SA }}"

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform -chdir=./test init

      - name: Terraform Destroy
        run: terraform -chdir=./test destroy -auto-approve -var="project_id=${{ secrets.GCP_PROJECT_ID }}" -var="impersonate_service_account=${{ secrets.GCP_IMPERSONATE_SA }}"
